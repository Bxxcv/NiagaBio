<!DOCTYPE html>
<html lang="id">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <meta content="noindex,nofollow" name="robots"/>
  <title>
   Masuk - NiagaBio
  </title>
  <meta content="NiagaBio adalah link bio dan katalog produk untuk UMKM." name="description"/>
  <link rel="icon" href="/favicon.ico?v=4" sizes="any">
  <link rel="shortcut icon" href="/favicon.ico?v=4" type="image/x-icon">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32x32.png?v=4">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16x16.png?v=4">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png?v=4">
  <link rel="manifest" href="/site.webmanifest">
<link href="https://cdn.jsdelivr.net" rel="preconnect"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="assets/css/v2/foundation.css" rel="stylesheet"/>
  <link href="assets/css/v2/auth.css" rel="stylesheet"/>
</head>
 <body class="auth-shell">
  <div class="auth-wrap">
   <div class="container">
    <div class="row justify-content-center">
     <div class="col-md-7 col-lg-5">
      <div class="text-center mb-4">
       <a href="/">
        <img alt="NiagaBio" class="auth-logo" src="assets/img/logo.jpg"/>
       </a>
       <h1 class="auth-title">Masuk ke Dashboard</h1>
       <p class="auth-subtitle">Kelola toko dan pesanan dari satu tempat.</p>
      </div>
      <div class="auth-card">
       <form id="loginForm" class="auth-form">
        <div class="mb-3">
         <label class="form-label" for="loginEmail">Email</label>
         <input class="form-control" id="loginEmail" required="" type="email" placeholder="nama@email.com"/>
        </div>
        <div class="mb-3">
         <label class="form-label" for="loginPassword">Password</label>
         <input class="form-control" id="loginPassword" required="" type="password" placeholder="••••••••"/>
        </div>
        <div class="d-flex justify-content-end mb-4">
         <button class="auth-forgot" id="forgotPasswordToggle" type="button">Lupa password?</button>
        </div>
        <button class="btn-nb" type="submit">Masuk</button>
       </form>
       <div class="alert-light mt-4" id="forgotPasswordBox" hidden="">
        <form id="forgotPasswordForm" class="auth-form">
         <h2 class="nb-h4 mb-2">Minta bantuan reset password</h2>
         <p class="nb-text-sm nb-text-muted mb-3">Email kamu akan masuk ke Admin Master. Admin akan mengirim link reset resmi ke email kamu.</p>
         <div class="mb-3">
          <label class="form-label" for="forgotEmail">Email akun</label>
          <input class="form-control" id="forgotEmail" required="" type="email" placeholder="email@contoh.com"/>
         </div>
         <div class="mb-3">
          <label class="form-label" for="forgotNote">Catatan opsional</label>
          <textarea class="form-control" id="forgotNote" rows="2" maxlength="300" placeholder="Contoh: saya lupa password akun toko saya"></textarea>
         </div>
         <button class="btn-outline-nb" type="submit">Kirim Permintaan</button>
        </form>
       </div>
       <p class="auth-footer">Belum punya akun? <a href="register">Daftar Gratis</a></p>
      </div>
     </div>
    </div>
   </div>
  </div>
  <script defer="" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>
  <script defer="" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>
  <script defer="" src="assets/js/config.js">
  </script>
  <script defer="" src="assets/js/supabase-client.js">
  </script>
  <script defer="" src="assets/js/common.js">
  </script>
  <script defer="" src="assets/js/auth.js">
  </script>
 </body>
</html>
