<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Daftar Gratis — NiagaBio</title>
<meta name="description" content="Buat akun NiagaBio gratis dan mulai jualan dengan satu link toko: katalog produk, checkout, dan rekap pesanan." />
<meta name="robots" content="noindex,nofollow" />
<meta name="theme-color" content="#0E7C5A" />
<link rel="icon" href="assets/img/niagabio-logo.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
<link rel="stylesheet" href="assets/css/v2/lovable-pages.css" />
</head>
<body>
<main class="page-slim">
  <span class="blob blob-1" aria-hidden="true"></span>
  <span class="blob blob-3" aria-hidden="true"></span>
  <a class="back-home" href="index.html"><i class="bi bi-arrow-left"></i> Kembali</a>

  <div class="auth-wrap">
    <div class="auth-art reveal">
      <img src="assets/illustrator/one-link.webp" alt="Ilustrasi satu link toko yang menampilkan banyak produk" width="1000" height="900" />
      <h2>Mulai jualan hari ini</h2>
      <p class="lead">Gratis selamanya, tanpa kartu kredit. Tinggal isi produk lalu bagikan satu link ke pembeli.</p>
    </div>

    <div class="auth-card reveal" data-delay="1">
      <img class="auth-mini-art" src="assets/illustrator/one-link.webp" alt="" width="1000" height="900" />
      <h1>Buat akun gratis</h1>
      <p class="lead">Satu menit saja, langsung punya halaman toko sendiri.</p>

      <form id="registerForm" novalidate>
        <div class="field">
          <label for="registerName">Nama toko</label>
          <div class="input-wrap">
            <i class="bi bi-shop"></i>
            <input id="registerName" name="name" type="text" autocomplete="organization" placeholder="Warung Lina" required />
          </div>
        </div>

        <div class="field">
          <label for="registerEmail">Email</label>
          <div class="input-wrap">
            <i class="bi bi-envelope"></i>
            <input id="registerEmail" name="email" type="email" autocomplete="email" placeholder="nama@email.com" required />
          </div>
          <span class="field-hint">Username toko dibuat otomatis dari email dan bisa diganti nanti di Profil.</span>
        </div>

        <div class="field">
          <label for="registerPassword">Kata sandi</label>
          <div class="input-wrap">
            <i class="bi bi-lock"></i>
            <input id="registerPassword" name="password" type="password" class="has-toggle" minlength="6" autocomplete="new-password" placeholder="Minimal 6 karakter" required />
            <button class="toggle-pass" data-target="registerPassword" aria-label="Lihat kata sandi" type="button">
              <i class="bi bi-eye"></i><i class="bi bi-eye-slash"></i>
            </button>
          </div>
        </div>

        <button class="btn btn-primary btn-block btn-lg" type="submit">Daftar gratis <i class="bi bi-arrow-right"></i></button>
      </form>

      <p class="auth-alt">Sudah punya akun? <a href="login.html">Masuk</a></p>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="assets/js/config.js" defer></script>
<script src="assets/js/supabase-client.js" defer></script>
<script src="assets/js/common.js" defer></script>
<script src="assets/js/auth.js" defer></script>
</body>
</html>
