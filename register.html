<!DOCTYPE html>
<html lang="id">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <meta content="noindex,nofollow" name="robots"/>
  <title>
   Daftar - NiagaBio
  </title>
  <meta content="NiagaBio adalah link bio dan katalog produk untuk UMKM." name="description"/>
  <link rel="icon" href="/favicon.ico?v=4" sizes="any">
  <link rel="shortcut icon" href="/favicon.ico?v=4" type="image/x-icon">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32x32.png?v=4">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16x16.png?v=4">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/niagabio-logo.svg?v=4">
  <link rel="manifest" href="/site.webmanifest">
<link href="https://cdn.jsdelivr.net" rel="preconnect"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="assets/css/v2/foundation.css" rel="stylesheet"/>
  <link href="assets/css/v2/auth.css" rel="stylesheet"/>
</head>
 <body class="auth-shell">
  <div class="auth-wrap">
   <div class="container">
    <div class="row justify-content-center">
     <div class="col-md-7 col-lg-5">
      <div class="text-center mb-4">
       <a href="/">
        <img alt="NiagaBio" class="auth-logo" src="assets/img/niagabio-logo.svg"/>
       </a>
       <h1 class="auth-title">Selamat Datang👋</h1>
       <p class="auth-subtitle">Mari bergabung bersama kami, Buat toko online ringan dan mulai dari paket Free.</p>
      </div>
      <div class="auth-card">
       <form id="registerForm" class="auth-form">
        <div class="mb-3">
         <label class="form-label" for="registerName">Nama toko / nama kamu</label>
         <input class="form-control" id="registerName" placeholder="Contoh: Niaga Store" required=""/>
        </div>
        <div class="mb-3">
         <label class="form-label" for="registerEmail">Email</label>
         <input class="form-control" id="registerEmail" required="" type="email" placeholder="nama@email.com"/>
        </div>
        <div class="mb-4">
         <label class="form-label" for="registerPassword">Password</label>
         <input class="form-control" id="registerPassword" minlength="6" required="" type="password" placeholder="Minimal 6 karakter"/>
        </div>
        <button class="nb-btn nb-btn-primary" type="submit">Daftar Gratis</button>
       </form>
       <p class="auth-footer">Sudah punya akun? <a href="login">Masuk</a></p>
      </div>
     </div>
    </div>
   </div>
  </div>
  <script defer="" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>
  <script defer="" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>
  <script defer="" src="assets/js/config.js">
  </script>
  <script defer="" src="assets/js/supabase-client.js">
  </script>
  <script defer="" src="assets/js/common.js">
  </script>
  <script defer="" src="assets/js/auth.js">
  </script>
 </body>
</html>
